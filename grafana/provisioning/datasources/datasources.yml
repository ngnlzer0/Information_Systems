apiVersion: 1

# Знак $ у provisioning-файлах Grafana розкривається як змінна середовища,
# тому всередині шаблонів Grafana його треба подвоювати: $${...}.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # У рядку логу є "trace_id": "..." — робимо з нього посилання на Tempo
      derivedFields:
        - name: trace_id
          datasourceUid: tempo
          matcherRegex: '"trace_id": ?"(\w+)"'
          url: '$${__value.raw}'
          urlDisplayLabel: Відкрити трейс у Tempo

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # Зі спану можна перейти до логів з тим самим trace_id
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
        customQuery: true
        query: '{service=~".+"} |= "$${__trace.traceId}"'
