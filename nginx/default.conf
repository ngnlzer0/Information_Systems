# Шлюз: єдина публічна точка входу. Усе, крім сторінки входу, закрите авторизацією.

# Потрібно для WebSocket (Grafana Live)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    # ---- Публічні маршрути сервера авторизації ----
    location = /login {
        proxy_pass http://auth:5000/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /logout {
        proxy_pass http://auth:5000/logout;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API авторизації: POST /auth/api/login, POST /auth/api/users
    # (/verify, /metrics, /health назовні НЕ віддаємо)
    location /auth/api/ {
        proxy_pass http://auth:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- Внутрішній підзапит перевірки токена ----
    location = /_auth_verify {
        internal;
        proxy_pass http://auth:5000/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- Усе інше - Grafana, але лише після успішної перевірки ----
    location / {
        auth_request /_auth_verify;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @to_login;

        # Перезаписує будь-який X-WEBAUTH-USER, надісланий клієнтом, тож підробити його неможливо.
        proxy_set_header X-WEBAUTH-USER $auth_user;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://grafana:3000;
    }

    location @to_login {
        return 302 /login?next=$uri;
    }
}
