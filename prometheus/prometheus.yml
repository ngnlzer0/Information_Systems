global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  # Сам Prometheus
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Метрики СУБД (наш Python-експортер)
  - job_name: postgres
    static_configs:
      - targets: ["db-exporter:8000"]

  # Метрики генератора навантаження (кількість і тривалість операцій)
  - job_name: generator
    static_configs:
      - targets: ["generator:8001"]

  # Метрики сервера авторизації
  - job_name: auth
    metrics_path: /metrics
    static_configs:
      - targets: ["auth:5000"]

  # Метрики самих сервісів спостережуваності
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
